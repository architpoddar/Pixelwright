<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" fill="none">
  <!-- Pixelwright GitHub README Banner -->
  <defs>
    <radialGradient id="bannerAmbient" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2638"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <filter id="iconDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="960" height="300" rx="16" fill="#0B0E14"/>
  <rect width="960" height="300" rx="16" fill="url(#bannerAmbient)"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="15.5" stroke="#212836" stroke-width="1"/>

  <!-- Left: The App Icon -->
  <g transform="translate(64, 60)" filter="url(#iconDrop)">
    <!-- Icon Squircle -->
    <rect width="180" height="180" rx="40.5" fill="url(#tileGrad)"/>
    <rect x="0.5" y="0.5" width="179" height="179" rx="40" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    
    <!-- Symbol (scale 1.8, centered in 180x180) -->
    <g transform="translate(36, 25) scale(1.8)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="
        M 24,14
        L 60,14
        A 20,20 0 0 1 80,34
        A 20,20 0 0 1 60,54
        L 36,54
        L 36,82
        A 4,4 0 0 1 32,86
        L 24,86
        A 4,4 0 0 1 20,82
        L 20,18
        A 4,4 0 0 1 24,14
        Z
        M 38.5,23
        L 55.5,23
        A 2.5,2.5 0 0 1 58,25.5
        L 58,42.5
        A 2.5,2.5 0 0 1 55.5,45
        L 38.5,45
        A 2.5,2.5 0 0 1 36,42.5
        L 36,25.5
        A 2.5,2.5 0 0 1 38.5,23
        Z"
        fill="#F8FAFC"/>
      <rect x="44" y="31" width="6" height="6" rx="1.5" fill="#3B82F6"/>
    </g>
  </g>

  <!-- Right: Typography & Value Pillars -->
  <g transform="translate(290, 68)">
    <!-- Brand Wordmark -->
    <text x="0" y="40"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Geist', sans-serif"
          font-size="44"
          font-weight="700"
          letter-spacing="-0.025em"
          fill="#FFFFFF">Pixelwright</text>

    <!-- Tagline -->
    <text x="0" y="74"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Geist', sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="-0.01em"
          fill="#3B82F6">Quietly precise. Strictly private.</text>

    <!-- One-line Descriptor -->
    <text x="0" y="104"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Geist', sans-serif"
          font-size="15"
          font-weight="400"
          fill="#94A3B8">The focused, fast image editor for Mac that does everyday tasks without the bloat.</text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 134)">
      <!-- Badge 1: Private -->
      <g>
        <rect width="144" height="28" rx="6" fill="#141B2D" stroke="#2563EB" stroke-opacity="0.4"/>
        <text x="72" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">100% ON-DEVICE</text>
      </g>
      <!-- Badge 2: Safe -->
      <g transform="translate(154, 0)">
        <rect width="180" height="28" rx="6" fill="#141B2D" stroke="#2563EB" stroke-opacity="0.4"/>
        <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">ORIGINALS UNTOUCHED</text>
      </g>
      <!-- Badge 3: Fast -->
      <g transform="translate(344, 0)">
        <rect width="138" height="28" rx="6" fill="#141B2D" stroke="#2563EB" stroke-opacity="0.4"/>
        <text x="69" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#93C5FD">PURE SWIFTUI & VISION</text>
      </g>
    </g>
  </g>
</svg>
